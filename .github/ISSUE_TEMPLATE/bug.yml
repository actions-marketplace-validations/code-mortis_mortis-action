name: Bug report
description: Report a reproducible problem in Mortis Action.
body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md first. Remove credentials, private endpoints, and private source from examples and logs.
        Follow SECURITY.md for vulnerability reports.
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a minimal workflow or synthetic fixture, the triggering event or command, and the exit status.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Mortis Action commit or tag:
        - Runner OS and architecture:
        - Trigger and command:
        - Provider, protocol, and model, if relevant (no credentials):
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Include relevant log lines or a publicly shareable run link. Remove private data before sharing.
