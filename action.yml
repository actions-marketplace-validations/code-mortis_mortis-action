name: Mortis Review and Scan
description: Review Git changes and scan a repository with Mortis Engine
branding:
  icon: shield
  color: purple
inputs:
  command:
    description: "Mortis command: review or scan"
    default: review
  base:
    description: Base Git ref for reviews outside pull requests
  head:
    description: Head Git ref for reviews outside pull requests
  ref:
    description: Git ref to scan (defaults to the workflow commit)
  provider:
    description: Mortis Engine API-key provider preset
    default: openai
  protocol:
    description: Optional API protocol override for the provider preset
  base-url:
    description: Optional API base URL override for the provider preset
  model:
    description: Fallback model when the committed Mortis configuration has no model
  review-forks:
    description: Automatically review fork PRs on pull_request_target
    default: "false"
  auto-describe:
    description: Fill the PR description summary from the opening or ready-for-review run
    default: "false"
  check-linked-issues:
    description: Assess requirements from explicitly linked issues using additional provider requests
    default: "false"
outputs:
  status:
    description: "Result status: completed, partial, failed, or skipped"
    value: ${{ steps.mortis.outputs.status }}
  run-id:
    description: Engine run ID, when a report is available
    value: ${{ steps.mortis.outputs.run-id }}
  report-json:
    description: Absolute path to the JSON report, when available
    value: ${{ steps.mortis.outputs.report-json }}
  report-markdown:
    description: Absolute path to the Markdown report, when available
    value: ${{ steps.mortis.outputs.report-markdown }}
  inline-posted:
    description: Current findings posted as new inline comments
    value: ${{ steps.mortis.outputs.inline-posted }}
  inline-existing:
    description: Current findings already represented by an inline comment
    value: ${{ steps.mortis.outputs.inline-existing }}
  summary-only:
    description: Current findings without an eligible inline location
    value: ${{ steps.mortis.outputs.summary-only }}
  inline-failed:
    description: Current findings for which inline delivery failed
    value: ${{ steps.mortis.outputs.inline-failed }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
    - id: mortis
      name: Run Mortis
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        MORTIS_COMMAND: ${{ inputs.command }}
        MORTIS_BASE: ${{ inputs.base }}
        MORTIS_HEAD: ${{ inputs.head }}
        MORTIS_REF: ${{ inputs.ref }}
        MORTIS_PROVIDER: ${{ inputs.provider }}
        MORTIS_PROTOCOL: ${{ inputs.protocol }}
        MORTIS_BASE_URL: ${{ inputs.base-url }}
        MORTIS_MODEL: ${{ inputs.model }}
        MORTIS_REVIEW_FORKS: ${{ inputs.review-forks }}
        MORTIS_AUTO_DESCRIBE: ${{ inputs.auto-describe }}
        MORTIS_CHECK_LINKED_ISSUES: ${{ inputs.check-linked-issues }}
        MORTIS_GITHUB_TOKEN: ${{ github.token }}
      run: python -I "$GITHUB_ACTION_PATH/run_mortis.py"
    - name: Save Mortis review history
      if: ${{ steps.mortis.outputs.baseline-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.mortis.outputs.baseline-name }}
        path: ${{ steps.mortis.outputs.baseline-path }}
        overwrite: true
        compression-level: 0
        if-no-files-found: error
    - name: Set Mortis exit status
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        MORTIS_EXIT_CODE: ${{ steps.mortis.outputs.exit-code }}
      run: exit "${MORTIS_EXIT_CODE:-1}"
